<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin - Zee Stream</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <header class="topbar">
      <div class="brand-wrap">
        <div class="brand">ZEE STREAM</div>
      </div>
      <nav class="nav">
        <a href="{{ url_for('index') }}">Site</a>
        <a href="{{ url_for('settings_page') }}">Settings</a>
        <a href="{{ url_for('logout') }}">Logout</a>
      </nav>
    </header>

    <main class="page admin-page">
      <h2>Admin Panel</h2>
      <div class="admin-actions">
        <a class="button primary" href="{{ url_for('sync_tmdb') }}">Sync TMDB</a>
      </div>

      <form class="admin-form" method="post" action="{{ url_for('admin_add') }}">
        <div class="form-grid">
          <input type="text" name="title" placeholder="Title" required>
          <input type="text" name="category" placeholder="Category" value="Hollywood">
          <input type="text" name="language" placeholder="Language" value="English">
          <input type="text" name="media_type" placeholder="Movie or series" value="movie">
          <input type="text" name="country" placeholder="Country" value="Worldwide">
          <input type="number" name="year" placeholder="Year" value="2024">
          <input type="number" step="0.1" name="rating" placeholder="Rating" value="0">
          <input type="text" name="source_type" placeholder="source_type" value="manual">
          <input type="text" name="video_url" placeholder="Video URL (optional)">
          <input type="text" name="download_url" placeholder="Download URL (optional)">
          <input type="text" name="poster_url" placeholder="Poster URL (optional)">
        </div>
        <textarea name="description" rows="4" placeholder="Description"></textarea>
        <button type="submit">Add Item</button>
      </form>

      <section class="admin-list">
        {% for item in media %}
          <div class="mini-card">
            <strong>{{ item.title }}</strong>
            <span>{{ item.category }} • {{ item.language }}</span>
          </div>
        {% endfor %}
      </section>
    </main>
  </body>
</html>
